name: yvoty

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yvoty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yvoty}
      POSTGRES_DB: ${POSTGRES_DB:-yvoty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yvoty} -d ${POSTGRES_DB:-yvoty}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
