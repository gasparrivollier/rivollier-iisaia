name: yvoty

services:
  postgres:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yvoty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yvoty}
      POSTGRES_DB: ${POSTGRES_DB:-yvoty}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yvoty} -d ${POSTGRES_DB:-yvoty}"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    # Official minio/minio images stopped being published (2025); Chainguard rebuilds MinIO.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    # Image runs as uid 65532; podman named volumes are root-owned, so run as root in dev.
    user: "0:0"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-yvoty}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-yvoty-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  fake-plantnet:
    build:
      context: .
      dockerfile: fake-plantnet/Dockerfile
    ports:
      - "8100:8100"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yvoty}:${POSTGRES_PASSWORD:-yvoty}@postgres:5432/${POSTGRES_DB:-yvoty}
      PLANTNET_BASE_URL: ${PLANTNET_BASE_URL:-http://fake-plantnet:8100}
      PLANTNET_API_KEY: ${PLANTNET_API_KEY:-fake-key}
      PLANTNET_PROJECT: ${PLANTNET_PROJECT:-all}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://127.0.0.1:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-yvoty}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-yvoty-secret}
      S3_BUCKET: ${S3_BUCKET:-yvoty-photos}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-jwt-secret-change-me-0123456789}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - minio
      - fake-plantnet

volumes:
  pgdata:
  miniodata:
