<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics="">
        <link rel="stylesheet" href="./tokens.css">
        <style>
          .frame { width: 100%; max-width: 430px; min-height: 100dvh; margin: 0 auto; background: var(--paper); display: flex; flex-direction: column; }
          .progress-card { margin: 16px 20px 0; padding: 13px 15px 14px; display: flex; flex-direction: column; gap: 9px; }
          .bar { height: 7px; border-radius: 100px; background: var(--forest-soft); overflow: hidden; }
          .bar-fill { height: 100%; border-radius: 100px; background: var(--forest); }
          .search {
            display: flex; align-items: center; gap: 10px;
            margin: 16px 20px 0; padding: 12px 16px;
            background: var(--paper-raised); border: 1px solid var(--line-strong);
            border-radius: 100px; font-size: 14px; color: var(--ink-faint);
          }
          .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 18px 20px 90px; }
          .specimen-card { display: flex; flex-direction: column; overflow: hidden; }
          .specimen-thumb { height: 130px; }
          .specimen-thumb .label { font-size: 9px; margin: 6px; padding: 3px 6px; }
          .specimen-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
          .fab {
            position: fixed; bottom: 26px; z-index: 20;
            left: 50%; margin-left: 137px;
            width: 58px; height: 58px; border-radius: 50%;
            background: var(--forest); color: var(--paper);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; font-weight: 400; cursor: pointer;
            border: 1.5px solid oklch(1 0 0 / 0.28);
            box-shadow: 0 10px 24px oklch(0.28 0.03 55 / 0.32), 0 2px 6px oklch(0.28 0.03 55 / 0.22);
            transition: transform 120ms ease, box-shadow 120ms ease;
          }
          .fab:hover { transform: translateY(-1px); box-shadow: 0 14px 30px oklch(0.28 0.03 55 / 0.36), 0 2px 6px oklch(0.28 0.03 55 / 0.22); }
          .fab:active { transform: translateY(1px); box-shadow: 0 6px 16px oklch(0.28 0.03 55 / 0.3); }
          /* Narrow viewports: the frame is the viewport, so pin to its right edge. */
          @media (max-width: 430px) {
            .fab { left: auto; right: 22px; margin-left: 0; }
          }
        </style>
      </helmet>
      <div class="frame" style="position:relative;">
        <div class="topbar">
          <div class="fx col">
            <span class="serif" style="font-size:21px; font-weight:600;">My Diary<br></span>
            <span style="font-size:12px; color:var(--ink-faint);">{{ count }} specimens catalogued</span>
          </div>
          <div class="quota-pill"><span class="dot"></span>{{ quotaRemaining }} ids left</div>
        </div>

        <a class="progress-card journal-card" href="./05-Region-Map.html" style="text-decoration:none;color:inherit;">
          <div class="fx jb ac">
            <span style="font-size:13px;font-weight:600;color:var(--ink-soft);">Collection progress &nbsp;›</span>
            <span style="font-family:ui-monospace,monospace;font-size:12.5px;font-weight:600;color:var(--forest);">{{ collected }}/{{ total }}</span>
          </div>
          <div class="bar"><div class="bar-fill" style="width:{{ progressPct }}%;"></div></div>
          <div style="font-size:12px;color:var(--ink-faint);">{{ progressNote }}</div>
        </a>

        <div class="search"><span>🔍</span><span>Search your garden…</span></div>

        <div class="grid" data-comment-anchor="2690525901-div">
          <sc-for list="{{ plants }}" as="p" hint-placeholder-count="6">
            <div class="specimen-card journal-card">
              <div class="specimen-thumb sketch-placeholder"><div class="label">{{ p.sketchLabel }}</div></div>
              <div class="specimen-body">
                <div style="font-size:14px; font-weight:600;">{{ p.nickname }}</div>
                <div class="serif-i" style="font-size:12.5px; color:var(--ink-soft);">{{ p.scientificName }}</div>
              </div>
            </div>
          </sc-for>
        </div>

        <div class="fab" data-comment-anchor="faca80929d-div">+</div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": { "width": 390, "height": 844 }
}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            count: 12,
            collected: 12,
            total: 120,
            progressPct: 10,
            progressNote: "10% of your region's common species catalogued",
            quotaRemaining: 481,
            plants: [
              { nickname: "Auntie's Jessamine", scientificName: "Murraya paniculata", sketchLabel: "sketch" },
              { nickname: "Balcony Basil", scientificName: "Ocimum basilicum", sketchLabel: "sketch" },
              { nickname: "Old Fig", scientificName: "Ficus carica", sketchLabel: "sketch" },
              { nickname: "Porch Fern", scientificName: "Nephrolepis exaltata", sketchLabel: "sketch" },
              { nickname: "Sunday Rose", scientificName: "Rosa chinensis", sketchLabel: "sketch" },
              { nickname: "Trailside Mint", scientificName: "Mentha spicata", sketchLabel: "sketch" },
            ],
          };
        }
      }
    </script>
  </body>
</html>
