<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="stylesheet" href="./tokens.css" />
        <style>
          .frame { width: 100%; max-width: 430px; min-height: 100dvh; margin: 0 auto; background: var(--paper); display: flex; flex-direction: column; }
          .organ-note {
            display: flex; align-items: center; gap: 10px;
            margin: 16px 20px 0; padding: 11px 14px;
            background: var(--gold-soft); border: 1px solid oklch(0.72 0.11 85 / 0.4);
            border-radius: 8px; font-size: 12.5px; color: oklch(0.42 0.09 85);
          }
          .candidate {
            display: flex; gap: 14px; padding: 16px; margin: 0 20px; cursor: pointer;
          }
          .candidate + .candidate { border-top: 1px solid var(--line); margin-top: 0; }
          .rank1 { border: 1.5px solid var(--forest); border-radius: 8px; background: oklch(0.42 0.1 150 / 0.05); margin-bottom: 14px; }
          .cand-thumb { width: 64px; height: 64px; border-radius: 6px; flex: none; }
          .cand-thumb .label { font-size: 8px; margin: 4px; padding: 2px 4px; }
          .pct { font-family: ui-monospace, monospace; font-size: 13px; font-weight: 600; color: var(--forest); flex: none; }
          .list-wrap { margin-top: 6px; }
          .save-row { padding: 4px 20px 20px; }
        </style>
      </helmet>
      <div class="frame">
        <div class="topbar">
          <a class="nav-back" href="./01-Capture.dc.html">&larr; Retake</a>
          <span class="serif nav-title">Results</span>
          <span style="width:52px;"></span>
        </div>

        <div class="organ-note">
          <span>&#127807;</span>
          <span>We detected a <strong>flower</strong> in photo 1 &mdash; great signal for identification.</span>
        </div>

        <div class="list-wrap fx col">
          <sc-for list="{{ candidates }}" as="c" hint-placeholder-count="4">
            <div class="candidate journal-card {{ c.rankClass }}">
              <div class="cand-thumb sketch-placeholder"><div class="label">{{ c.sketchLabel }}</div></div>
              <div class="fx col gap6" style="flex:1; min-width:0;">
                <div class="fx jb ac gap8">
                  <div class="serif-i" style="font-size:16px; line-height:1.2;">{{ c.scientificName }}</div>
                  <div class="pct">{{ c.scorePct }}</div>
                </div>
                <div style="font-size:13px; color:var(--ink-soft);">{{ c.commonName }}</div>
                <div class="scorebar-track" style="margin-top:2px;"><div class="scorebar-fill" style="width:{{ c.scorePct }};"></div></div>
                <div class="fx gap6" style="margin-top:2px;">
                  <span class="tag">{{ c.family }}</span>
                  <sc-if value="{{ c.isTop }}">
                    <span class="tag terracotta">Best match</span>
                  </sc-if>
                </div>
              </div>
            </div>
          </sc-for>
        </div>

        <div class="save-row" style="margin-top:auto;">
          <button class="btn btn-primary" style="width:100%;">Save best match to my garden</button>
        </div>
      </div>
    </x-dc>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{
  "$preview": { "width": 390, "height": 844 }
}'
    >
      class Component extends DCLogic {
        renderVals() {
          return {
            candidates: [
              {
                scientificName: "Murraya paniculata",
                commonName: "Orange jessamine",
                family: "Rutaceae",
                scorePct: "87%",
                sketchLabel: "sketch:\nflower",
                rankClass: "rank1",
                isTop: true,
              },
              {
                scientificName: "Murraya koenigii",
                commonName: "Curry leaf tree",
                family: "Rutaceae",
                scorePct: "6%",
                sketchLabel: "sketch:\nleaf",
                rankClass: "",
                isTop: false,
              },
              {
                scientificName: "Citrus japonica",
                commonName: "Kumquat",
                family: "Rutaceae",
                scorePct: "3%",
                sketchLabel: "sketch:\nfruit",
                rankClass: "",
                isTop: false,
              },
              {
                scientificName: "Jasminum sambac",
                commonName: "Arabian jasmine",
                family: "Oleaceae",
                scorePct: "2%",
                sketchLabel: "sketch:\nflower",
                rankClass: "",
                isTop: false,
              },
            ],
          };
        }
      }
    </script>
  </body>
</html>
